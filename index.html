<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แก๊งเรามันสุดยอด - Friendship Roast Room</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        #login-screen {
            background: rgba(20, 20, 35, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(0, 240, 255, 0.4);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            animation: fadeIn 0.5s ease-in-out;
        }

        h1 {
            color: #00ffff;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
        }

        p {
            color: #b2bec3;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00d2d3;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.6);
        }

        .btn {
            background: linear-gradient(135deg, #00d2d3, #0097e6);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,151,230,0.4);
            transition: 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #main-screen {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .welcome-text {
            font-size: 18px;
            color: #f1c40f;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(241,196,15,0.4);
        }

        .friends-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .friend-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .friend-card:hover {
            transform: translateY(-5px);
            border-color: #00ffff;
            box-shadow: 0 8px 25px rgba(0,240,255,0.4);
            background: rgba(0, 240, 255, 0.1);
        }

        .friend-card h3 {
            margin: 0;
            font-size: 20px;
            color: #ff9f43;
        }

        #message-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.3s ease-in-out;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e1e2f, #2d2b4e);
            border: 2px solid #ff4757;
            padding: 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 380px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
        }

        .modal-content h2 {
            color: #ff4757;
            margin-top: 0;
            font-size: 22px;
        }

        .modal-content p {
            color: #f1f2f6;
            font-size: 15px;
            line-height: 1.6;
            margin: 20px 0;
            text-align: left;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid #ff4757;
        }

        .close-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,71,87,0.4);
            transition: 0.2s;
        }

        .close-btn:active {
            transform: scale(0.95);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- หน้าจอใส่ชื่อ -->
        <div id="login-screen">
            <h1>✨ Gang of Friends ✨</h1>
            <p>กรอกชื่อของคุณก่อนเข้าไปส่องเพื่อนซี้!</p>
            <input type="text" id="username-input" placeholder="พิมพ์ชื่อของคุณที่นี่...">
            <button class="btn" onclick="enterApp()">เข้าสู่ระบบ 🚀</button>
        </div>

        <!-- หน้าจอเลือกเพื่อน -->
        <div id="main-screen">
            <div class="welcome-text" id="welcome-msg">ยินดีต้อนรับ!</div>
            <p>เลือกชื่อเพื่อนที่คุณอยากแอบส่องความจริง:</p>
            
            <div class="friends-grid">
                <div class="friend-card" onclick="showRoast('อ้อต')">
                    <h3>💎 อ้อต</h3>
                    <small style="color: #a4b0be;">ตัวมารดาแก๊ง</small>
                </div>
                <div class="friend-card" onclick="showRoast('แตม')">
                    <h3>🥟 แตม</h3>
                    <small style="color: #a4b0be;">สายฮาปากหมา</small>
                </div>
                <div class="friend-card" onclick="showRoast('บีม')">
                    <h3>🎨 บีม</h3>
                    <small style="color: #a4b0be;">นักวาดทรงบอลลิ่ง</small>
                </div>
                <div class="friend-card" onclick="showRoast('นุ่น')">
                    <h3>🦷 นุ่น</h3>
                    <small style="color: #a4b0be;">ตะเกียบพูดมาก</small>
                </div>
            </div>
        </div>
    </div>

    <!-- หน้าต่างแสดงข้อความ (Modal) -->
    <div id="message-modal">
        <div class="modal-content">
            <h2 id="modal-title">หัวข้อ</h2>
            <p id="modal-text">ข้อความ...</p>
            <button class="close-btn" onclick="closeModal()">ปิดหน้าต่าง ❌</button>
        </div>
    </div>

    <script>
        let userName = "";

        const roastData = {
            "อ้อต": {
                title: "💎 ความจริงของ 'อ้อต'",
                text: "อ้อตถึงมึง จะแอ๊บสวย แรดนิดนึง แต่มึงก็ฉลาดเรียนเก่ง มึงเองก็มีน้ำใจ มึงเป็นคนดีมากๆ อันนี้กูพูดจริงๆ (🦷แซก)"
            },
            "แตม": {
                title: "🥟 ความจริงของ 'แตม'",
                text: "แตม ถึงมึงจะอ้วน คอดำชอบนินทาเรื่องชาวบ้าน แต่มึงก็เป็นคนนึงที่รักเพื่อนถึงจะปากหมาไปหน่อย แต่โดยรวมมึงก็ไม่ได้แย่ มึงเป็นคนตลก ทำให้ทุกคนมีความสุขได้"
            },
            "บีม": {
                title: "🎨 ความจริงของ 'บีม'",
                text: "บีมถึงแม้มึงจะหน้ากลมเหมือนบอลลิ่งชอบวาดอนิเมะปัญญาอ่อน ชอบกรก็เถอะ แต่มึงก็... กุนึกข้อดีไม่ออกไว้คราวหลัง"
            },
            "นุ่น": {
                title: "🦷 ความจริงของ 'นุ่น'",
                text: "นุ่นถึงแม้ฟันมึงจะทะเลาะกันบ่อยครั้ง อย่างน้อยเองก็ไม่ได้มีฟันที่ทะเลาะกันคนเดียวนะ ยังมีเพื่อนอีกคนนึง มึงน่าจะรู้ ถึงมึงจะผอมเป็นตะเกียบ ขี่บ่นพูดมาก แต่มึงก็แรงเยอะดึงผมอีแตมที วิคแทบหลุด แต่มึงก็มีน้ำใจมาก ซื้อขนมมาทีไรเรียกเพื่อนมากิน เพราะตัวเองกินไม่ได้ ติดร่องฟัน"
            }
        };

        function enterApp() {
            const input = document.getElementById('username-input').value.trim();
            if (input === "") {
                alert("กรุณากรอกชื่อก่อนเข้าสู่ระบบครับ!");
                return;
            }
            userName = input;
            document.getElementById('welcome-msg').innerText = `ยินดีต้อนรับคุณ [ ${userName} ] เข้าสู่แก๊ง! 🎉`;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
        }

        function showRoast(friendName) {
            const data = roastData[friendName];
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-text').innerText = data.text;
            document.getElementById('message-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('message-modal').style.display = 'none';
        }
    </script>
</body>
  </html>
